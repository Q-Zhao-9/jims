# Example: single server on port 80 — JIMS SPA + /api proxy.
# If you use the stock nginx.conf, prefer: include jims-api-location.conf + root/try_files as in README.

server {
    listen       80;
    server_name  localhost;

    access_log  logs/jims.access.log  main;

    root  C:/webapps/jims/www;
    index index.html;

    include C:/python_workspace/JIMS/deploy/nginx/jims-api-location.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
