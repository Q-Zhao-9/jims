# Dev Postgres:       docker compose up -d db
# Prod Postgres:      docker compose up -d db_prod
# Full app (Docker):  docker compose up --build -d api web   (needs healthy db first)
#
# Browser: http://localhost:8080  (override JIMS_WEB_PORT in .env)

services:
  db:
    image: postgres:16-alpine
    container_name: jims-postgres-dev
    environment:
      POSTGRES_USER: jims
      POSTGRES_PASSWORD: jims
      POSTGRES_DB: jims
    ports:
      - "${JIMS_DB_HOST_PORT:-5432}:5432"
    volumes:
      - jims_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jims -d jims"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db_prod:
    image: postgres:16-alpine
    container_name: jims-postgres-prod
    environment:
      POSTGRES_USER: jims
      POSTGRES_PASSWORD: jims_prod
      POSTGRES_DB: jims
    ports:
      - "5433:5432"
    volumes:
      - jims_pgdata_prod:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jims-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jims:jims@db:5432/jims
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - jims_api_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jims-web
    restart: unless-stopped
    ports:
      - "${JIMS_WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  jims_pgdata:
  jims_pgdata_prod:
  jims_api_uploads:
